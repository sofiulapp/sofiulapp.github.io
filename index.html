<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIUL - Mobile Live System</title>
    
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SOFIUL">
    <link rel="apple-touch-icon" href="https://i.ibb.co/PqLknBx/1000731214.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121826;
            --accent-primary: #3b82f6;
            --accent-secondary: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --mascot-glow-color: #06b6d4;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 30px; overflow-x: hidden;
        }
        
        .stage-area {
            width: 100%; height: 110px; background: #05080f;
            position: relative; overflow: hidden; border-bottom: 2px solid rgba(6, 182, 212, 0.3);
            display: flex; align-items: center; justify-content: center;
        }

        .logo-container {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid #06b6d4; background: #000;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            position: relative; overflow: hidden;
        }

        #logo-fixed {
            position: absolute; top: 60%; left: 47%;
            width: 85px; height: 85px;
            transform: translate(-50%, -50%); object-fit: cover;
        }

        .stage-mascot-area {
            width: 100%; height: 100px; background: rgba(59, 130, 246, 0.02);
            position: relative; overflow: hidden; border-bottom: 2px dashed rgba(59, 130, 246, 0.2);
            touch-action: none;
        }

        .neon-mascot-container {
            width: 65px; height: 65px; border-radius: 50%;
            position: absolute; top: 15px; left: 20px; 
            border: 3px solid var(--mascot-glow-color);
            overflow: hidden; transform-origin: bottom center;
            animation: mascotSmoothSwing 8s infinite ease-in-out;
        }

        #avatar-layer { 
            position: absolute; top: 52%; left: 48.5%; 
            width: 85px; height: 85px;
            object-fit: cover; transform: translate(-50%, -50%); z-index: 2;
        } 

        @keyframes mascotSmoothSwing {
            0%   { transform: rotate(0deg); }
            50%  { transform: rotate(25deg); }   
            100% { transform: rotate(0deg); }
        }

        header { width: 100%; text-align: center; background: var(--bg-color); position: sticky; top: 0; z-index: 10; }
        .mascot-status-tag { font-size: 0.5rem; color: var(--accent-secondary); text-transform: uppercase; padding: 2px 0; font-weight: bold; background: var(--bg-color); }
        .container { width: 95%; max-width: 360px; margin: 6px auto; display: flex; flex-direction: column; gap: 6px; }
        
        .card {
            background-color: var(--card-bg); border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px; padding: 5px 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .card-title { font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .status-badge { font-size: 0.45rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
        
        .dropdown-trigger-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff; border: none; border-radius: 4px; padding: 5px;
            font-size: 0.55rem; font-weight: bold; text-align: center; cursor: pointer;
            width: 100%; text-transform: uppercase;
        }

        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .collapsible-content.show { max-height: 3500px; transition: max-height 0.4s ease-in; }

        /* 🔥 GRILLA ESTRICTA EN 2 COLUMNAS (BOTONES COMPACTOS DE ~1CM²) 🔥 */
        .grid-2col-compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .mini-control-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 5px;
            padding: 6px 4px;
            text-align: center;
            color: #fff;
            font-size: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 28px;
            box-sizing: border-box;
            font-style: italic;
        }

        .mini-btn-box {
            background: rgba(59, 130, 246, 0.04);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 5px;
            padding: 4px;
            text-align: center;
        }

        .mini-title {
            font-size: 0.48rem;
            color: var(--accent-secondary);
            font-weight: bold;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-play-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: #fff; border: none; border-radius: 3px;
            padding: 3px; font-size: 0.48rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase; margin-bottom: 2px;
        }

        .mini-upload-label {
            display: block;
            background: rgba(6, 182, 212, 0.1);
            border: 1px dashed rgba(6, 182, 212, 0.4);
            color: #67e8f9; padding: 2px; border-radius: 3px;
            font-size: 0.42rem; font-weight: bold; cursor: pointer;
            text-align: center;
        }

        .ocultar-interfaz-total {
            opacity: 0 !important; visibility: hidden !important; pointer-events: none !important;
        }
    </style>
</head>
<body id="main-body-container">
    <div id="wrapper-elementos-visibles" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <header id="main-header-area" style="width: 100%;">
            <div class="stage-area">
                <div class="logo-container">
                    <img id="logo-fixed" src="https://i.ibb.co/PqLknBx/1000731214.png" alt="Logo">
                </div>
            </div>

            <div class="stage-mascot-area" id="mascot-stage">
                <div class="neon-mascot-container" id="mascot-frame">
                    <img id="avatar-layer" src="https://i.ibb.co/S4Yq8R0K/1000731133.png" alt="Mascota">
                </div>
            </div>
            <div class="mascot-status-tag" id="mascot-status-text">🟢 SOFIUL VIVO</div>
        </header>

        <div class="container">
            <!-- PANEL EN VIVO: TODOS LOS BOTONES ORGANIZADOS EN 2 COLUMNAS ULTRA COMPACTAS -->
            <div class="card" style="border-color: var(--accent-secondary); background: rgba(6, 182, 212, 0.03);">
                <div class="card-title" style="color: var(--accent-secondary);">
                    <span>🚀 PANEL EN VIVO (MINI-CONTROLES 2 COLUMNAS)</span>
                    <span class="status-badge" style="background:rgba(6,182,212,0.2);">ACTIVO</span>
                </div>

                <button class="dropdown-trigger-btn" id="toggle-transmission-btn">
                    🎛️ ABRIR PANEL DE BOTONES
                </button>
                
                <div class="collapsible-content" id="transmission-content">
                    <div class="card" style="background: rgba(0,0,0,0.4); margin-top: 4px; padding: 4px;">
                        
                        <div style="font-size: 0.48rem; color: var(--accent-secondary); font-weight: bold; margin-bottom: 2px;">
                            ⚡ Comandos Rápidos &amp; Acciones:
                        </div>

                        <!-- 🚀 TODOS LOS BOTONES SUPERIORES ORGANIZADOS EN 2 COLUMNAS DE 1CM² -->
                        <div class="grid-2col-compact" style="margin-bottom: 6px;">
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #22c55e, #10b981);" onclick="triggerVictoryEffect()">🎉 Triunfo</button>
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #64748b, #ef4444);" onclick="triggerDefeatEffect()">💧 Derrota</button>
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);" onclick="simulateMvpAnnouncement()">🏆 Top 3 MVP</button>
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #10b981, #06b6d4); color:#000;" onclick="simulateSmartBotGreeting()">🤖 Saludo Bot</button>
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #3b82f6, #06b6d4);" id="battle-toggle-btn" onclick="toggleBattleMode()">⚔️ Batalla</button>
                            
                            <!-- Botón Lápiz e Interruptor 7° MP3 en la misma cuadrícula -->
                            <button class="mini-control-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706);" onclick="toggleOcultarInterfazGeneral()">✏️ Lápiz (Ocultar)</button>
                            
                            <label class="mini-control-btn" style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); cursor:pointer; grid-column: span 2;">
                                🎵 7° MP3 Extra (Subir Audio)
                                <input type="file" accept="audio/mp3,audio/*" onchange="playSeventhCustomSound(this)" style="display:none;">
                            </label>
                        </div>

                        <div style="font-size: 0.48rem; color: var(--accent-secondary); font-weight: bold; margin-bottom: 2px;">
                            🎮 Banco de Efectos (2 Columnas Compactas):
                        </div>

                        <!-- 🚀 GRILLA DE 6 EFECTOS TEMÁTICOS EN 2 COLUMNAS -->
                        <div class="grid-2col-compact">
                            <div class="mini-btn-box">
                                <div class="mini-title">🤣 Risa Burlona</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('Risa Burlona')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, 'Risa Burlona')" style="display:none;"></label>
                            </div>
                            <div class="mini-btn-box">
                                <div class="mini-title">🔥 Grito Guerra</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('Grito Guerra')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, 'Grito Guerra')" style="display:none;"></label>
                            </div>
                            <div class="mini-btn-box">
                                <div class="mini-title">⚡ Susto/Impacto</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('Susto/Impacto')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, 'Susto/Impacto')" style="display:none;"></label>
                            </div>
                            <div class="mini-btn-box">
                                <div class="mini-title">🎉 ¡Victoria!</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('¡Victoria!')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, '¡Victoria!')" style="display:none;"></label>
                            </div>
                            <div class="mini-btn-box">
                                <div class="mini-title">💀 ¡Ay No!</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('¡Ay No!')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, '¡Ay No!')" style="display:none;"></label>
                            </div>
                            <div class="mini-btn-box">
                                <div class="mini-title">🚀 ¡Imparable!</div>
                                <button class="mini-play-btn" onclick="playCustomEffect('¡Imparable!')">▶ Tocar</button>
                                <label class="mini-upload-label">📁 MP3<input type="file" accept="audio/mp3" onchange="loadCustomEffect(this, '¡Imparable!')" style="display:none;"></label>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE PARA RESTAURAR LA PANTALLA CUANDO SE OCULTE -->
    <button id="btn-flotante-restaurar" onclick="toggleOcultarInterfazGeneral()" style="position: fixed; bottom: 10px; right: 10px; z-index: 99999; background: #f59e0b; color: #000; border-radius: 20px; padding: 4px 8px; font-size: 0.55rem; font-weight: bold; cursor: pointer; display: none;">
        ✏️ MOSTRAR INTERFAZ
    </button>

    <script>
        let customEffectUrls = {};
        let interfazOculta = false;
        let isBattleMode = false;

        document.getElementById("toggle-transmission-btn").addEventListener("click", function() {
            const content = document.getElementById("transmission-content");
            content.classList.toggle("show");
            this.innerText = content.classList.contains("show") ? "🎛️ CERRAR PANEL DE BOTONES" : "🎛️ ABRIR PANEL DE BOTONES";
        });

        function toggleOcultarInterfazGeneral() {
            interfazOculta = !interfazOculta;
            const wrapper = document.getElementById("wrapper-elementos-visibles");
            const btnRest = document.getElementById("btn-flotante-restaurar");
            if (interfazOculta) {
                wrapper.classList.add("ocultar-interfaz-total");
                btnRest.style.display = "block";
            } else {
                wrapper.classList.remove("ocultar-interfaz-total");
                btnRest.style.display = "none";
            }
        }

        function playSeventhCustomSound(input) {
            if (input.files && input.files[0]) {
                const audio = new Audio(URL.createObjectURL(input.files[0]));
                audio.play().catch(e => console.log(e));
                alert("✅ 7° Audio MP3 reproducido con éxito.");
            }
        }

        function playCustomEffect(label) {
            let url = customEffectUrls[label];
            if (!url) {
                alert(`⚠️ Sube primero el MP3 para '${label}' usando el botón inferior.`);
                return;
            }
            const audio = new Audio(url);
            audio.play().catch(e => console.log(e));
        }

        function loadCustomEffect(input, label) {
            if (input.files && input.files[0]) {
                customEffectUrls[label] = URL.createObjectURL(input.files[0]);
                alert(`✅ Audio '${label}' guardado y listo.`);
            }
        }

        function triggerVictoryEffect() { alert("🎉 ¡Efecto Triunfo activado!"); }
        function triggerDefeatEffect() { alert("💧 ¡Efecto Derrota activado!"); }
        function simulateMvpAnnouncement() { alert("🏆 ¡Anuncio Top 3 MVP activado!"); }
        function simulateSmartBotGreeting() { alert("🤖 ¡Saludo inteligente activado!"); }
        function toggleBattleMode() {
            isBattleMode = !isBattleMode;
            const btn = document.getElementById("battle-toggle-btn");
            btn.innerText = isBattleMode ? "⚔️ Salir Batalla" : "⚔️ Batalla";
            btn.style.background = isBattleMode ? "#ef4444" : "linear-gradient(135deg, #3b82f6, #06b6d4)";
        }
    </script>
</body>
</html>
