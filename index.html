<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIUL - Mobile Live System</title>
    <meta name="theme-color" content="#070a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0b1424;
            --accent-cyan: #00e5ff;
            --accent-blue: #0088ff;
            --accent-purple: #9a2ba2;
            --accent-red: #ff2a5f;
            --text-main: #ffffff;
            --text-muted: #8c82ce;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 40px; overflow-x: hidden;
        }
        
        /* Zona Visual Superior Original */
        .stage-area {
            width: 100%; height: 180px; background: #03060a;
            position: relative; overflow: hidden; border-bottom: 2px solid rgba(0, 229, 255, 0.3);
        }

        /* Círculo Brilloso en su posición exacta original */
        .neon-container {
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid var(--accent-cyan);
            position: absolute; top: 35px; left: 40px; overflow: hidden; background: #000;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
            will-change: transform, left, top, box-shadow, border-color;
            transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }
        
        /* Efecto Vivo cuando habla o interactúa */
        .neon-container.speaking {
            border-color: #ff69b4 !important;
            box-shadow: 0 0 45px rgba(255, 105, 180, 0.9) !important;
            transform: scale(1.15);
        }

        /* MODO BATALLA: Anclado al centro */
        .neon-container.battle-mode {
            position: relative !important;
            top: auto !important; left: auto !important;
            margin: 15px auto !important; transform: scale(0.9) !important;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.8) !important;
            border-color: #ffaa00 !important;
        }
        
        /* LOGOTIPO: Ajuste exacto bajado a 61% para que coincida perfectamente con tu referencia */
        #logo-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 1; z-index: 2; 
            object-fit: cover; 
            object-position: center 61%; 
            transform: scale(1.15);
            transform-origin: center center;
            transition: opacity 0.4s ease;
        } 
        
        /* MASCOTA: Intacta, exactamente como me pediste que no se toque */
        #avatar-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; z-index: 1; 
            object-fit: cover; 
            transform: scale(1.35);
            transform-origin: center center;
            transition: opacity 0.4s ease;
        } 

        /* Transición de la mascota al activarse */
        .neon-container.show-mascot #logo-layer { opacity: 0; }
        .neon-container.show-mascot #avatar-layer { opacity: 1; }

        header {
            width: 100%; text-align: center; background: #070a12; position: sticky; top: 0; z-index: 10;
        }
        
        .mascot-status-tag {
            font-size: 0.6rem; color: var(--accent-cyan); text-transform: uppercase;
            letter-spacing: 2px; padding: 4px 0; font-weight: bold; font-style: italic; background: #070a12;
        }
        
        .container { width: 92%; max-width: 420px; margin: 12px auto; display: flex; flex-direction: column; gap: 10px; }
        
        .card {
            background-color: var(--card-bg); border: 1px solid rgba(0, 181, 255, 0.2);
            border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-style: italic; }
        .status-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 0.7rem; color: #a19bc8; margin-bottom: 3px; font-style: italic; }
        .neon-input {
            width: 100%; background: rgba(0, 229, 255, 0.05); border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 6px; padding: 8px; color: #fff; font-size: 0.85rem; box-sizing: border-box;
            outline: none; font-family: inherit; font-style: italic;
        }

        .dropdown-trigger-btn {
            background: linear-gradient(135deg, #ff2a5f, #0088ff);
            color: #fff; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.75rem; font-weight: bold; text-align: center; cursor: pointer;
            width: 100%; text-transform: uppercase; font-style: italic; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4); margin-top: 6px;
        }

        .voice-dropdown-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.75rem; font-weight: bold; text-align: center; cursor: pointer;
            width: 100%; text-transform: uppercase; font-style: italic; box-sizing: border-box;
            margin-top: 6px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .collapsible-content.show { max-height: 1800px; transition: max-height 0.5s ease-in; }

        .effects-grid-6 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
        }
        .effect-box {
            background: rgba(255, 42, 95, 0.05); border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 8px; padding: 8px; text-align: center;
        }
        .effect-box-title {
            font-size: 0.65rem; color: #ff2a5f; font-weight: bold; font-style: italic; margin-bottom: 6px; min-height: 22px;
        }
        .play-effect-btn {
            width: 100%; background: rgba(255, 42, 95, 0.2); border: 1px solid rgba(255, 42, 95, 0.4);
            color: #ff2a5f; padding: 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase; font-style: italic; margin-bottom: 4px;
        }
        .upload-effect-label {
            display: block; background: rgba(154, 43, 162, 0.2); border: 1px dashed rgba(154, 43, 162, 0.6);
            color: #e2b7ff; padding: 5px; border-radius: 4px; font-size: 0.55rem; font-weight: bold;
            cursor: pointer; font-style: italic; text-align: center;
        }

        .voice-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.15);
            padding: 6px 10px; border-radius: 6px; margin-bottom: 5px; font-size: 0.75rem; font-style: italic;
        }
        .test-btn {
            background: rgba(0, 229, 255, 0.15); border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--accent-cyan); padding: 4px 8px; border-radius: 4px; font-size: 0.6rem;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-style: italic;
        }
        .toggle-btn {
            background: rgba(255, 42, 95, 0.2); border: 1px solid rgba(255, 42, 95, 0.5);
            color: #ff2a5f; padding: 4px 10px; border-radius: 4px; font-size: 0.6rem;
            font-weight: bold; cursor: pointer; text-transform: uppercase; font-style: italic;
        }
        .toggle-btn.active-on {
            background: rgba(0, 229, 255, 0.3); border-color: var(--accent-cyan);
            color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
        }

        .action-button {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.9rem; font-weight: bold; text-align: center; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 181, 255, 0.4); text-transform: uppercase; margin-top: 10px;
            font-style: italic; width: 100%; box-sizing: border-box;
        }
        .save-notice { font-size: 0.65rem; color: #00e5ff; text-align: center; font-style: italic; margin-top: 4px; display: none; }
    </style>
</head>
