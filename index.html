<!-- ZONA DE LA MASCOTA: Iluminación interna y externa sincronizada (Cambio cada 4s por color) -->
<div class="stage-mascot-area" id="mascot-stage">
    <div class="neon-mascot-container" id="mascot-frame">
        <img id="avatar-layer" src="https://i.ibb.co/S4Yq8R0K/1000731133.png" alt="Mascota Virtual">
    </div>
</div>

<style>
    .stage-mascot-area {
        width: 100%; height: 160px; background: rgba(59, 130, 246, 0.02);
        position: relative; overflow: hidden; border-bottom: 2px dashed rgba(59, 130, 246, 0.2);
        touch-action: none;
    }

    .neon-mascot-container {
        width: 110px; height: 110px; border-radius: 50%;
        position: absolute; top: 20px; left: 30px; overflow: hidden; 
        will-change: transform, left, top, box-shadow, border-color, background-color;
        /* 24 segundos total / 6 colores = exactamente 4 segundos por color */
        animation: mascotTimerGlow 24s infinite linear;
    }

    .neon-mascot-container.battle-mode {
        cursor: grab;
        animation: mascotBattleGlow 2s infinite linear !important;
    }
    .neon-mascot-container.battle-mode:active { cursor: grabbing; }

    /* Relleno interior y borde exterior brillando con el mismo color exacto cada 4s */
    @keyframes mascotTimerGlow {
        0%   { border: 5px solid #06b6d4; background-color: #06b6d4; box-shadow: 0 0 40px #06b6d4, inset 0 0 45px #06b6d4; }
        16.6%{ border: 5px solid #10b981; background-color: #10b981; box-shadow: 0 0 40px #10b981, inset 0 0 45px #10b981; }
        33.3%{ border: 5px solid #a855f7; background-color: #a855f7; box-shadow: 0 0 40px #a855f7, inset 0 0 45px #a855f7; }
        50%  { border: 5px solid #f43f5e; background-color: #f43f5e; box-shadow: 0 0 40px #f43f5e, inset 0 0 45px #f43f5e; }
        66.6%{ border: 5px solid #0ea5e9; background-color: #0ea5e9; box-shadow: 0 0 40px #0ea5e9, inset 0 0 45px #0ea5e9; }
        83.3%{ border: 5px solid #f59e0b; background-color: #f59e0b; box-shadow: 0 0 40px #f59e0b, inset 0 0 45px #f59e0b; }
        100% { border: 5px solid #06b6d4; background-color: #06b6d4; box-shadow: 0 0 40px #06b6d4, inset 0 0 45px #06b6d4; }
    }

    #avatar-layer { 
        position: absolute; top: 52%; left: 48.5%; 
        width: 136px; height: 136px;
        object-fit: cover; transform: translate(-50%, -50%);
        filter: brightness(1.25) saturate(1.15);
    } 

    @keyframes mascotBattleGlow {
        0%   { border: 5px solid #3b82f6; background-color: #3b82f6; box-shadow: 0 0 50px #3b82f6, inset 0 0 55px #3b82f6; }
        50%  { border: 5px solid #ec4899; background-color: #ec4899; box-shadow: 0 0 50px #ec4899, inset 0 0 55px #ec4899; }
        100% { border: 5px solid #3b82f6; background-color: #3b82f6; box-shadow: 0 0 50px #3b82f6, inset 0 0 55px #3b82f6; }
    }
</style>
