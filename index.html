<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIUL - Mobile Live System</title>
    <meta name="theme-color" content="#070a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #070a12;
            --card-bg: #0b1424;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8c82ce;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 40px; overflow-x: hidden;
        }
        
        /* Zona Visual Superior Original */
        .stage-area {
            width: 100%; height: 180px; background: #03060a;
            position: relative; overflow: hidden; border-bottom: 2px solid rgba(0, 242, 254, 0.3);
        }

        /* Círculo Brilloso Base */
        .neon-container {
            width: 110px; height: 110px; border-radius: 50%;
            border: 3px solid var(--accent-cyan);
            position: absolute; top: 35px; left: 40px; overflow: hidden; background: #000;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
            will-change: transform, left, top, box-shadow, border-color;
            transition: transform 0.4s ease;
        }
        
        /* LOGOTIPO ESTÁTICO: Color oficial fijo y puro neón con respiración sutil (Inamovible) */
        .neon-container:not(.show-mascot) {
            border-color: #00f2fe !important;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7) !important;
            animation: logoRespiration 3.5s infinite ease-in-out;
        }

        @keyframes logoRespiration {
            0% {
                border-color: rgba(0, 242, 254, 0.5);
                box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            }
            50% {
                border-color: rgba(0, 242, 254, 1);
                box-shadow: 0 0 35px rgba(0, 242, 254, 0.9);
            }
            100% {
                border-color: rgba(0, 242, 254, 0.5);
                box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            }
        }

        /* MODO NORMAL: 5 Colores terapéuticos, lentos y balance suave de lado a lado hasta la mitad */
        .neon-container #avatar-layer {
            animation: mascotTherapeuticCycle 15s infinite ease-in-out, mascotHalfBalance 3s infinite ease-in-out;
        }

        @keyframes mascotTherapeuticCycle {
            0%   { filter: hue-rotate(0deg) saturate(1.2) brightness(1.05); }   /* Cian suave / Paz */
            20%  { filter: hue-rotate(70deg) saturate(1.3) brightness(1.1); }    /* Verde menta / Descanso visual */
            40%  { filter: hue-rotate(160deg) saturate(1.2) brightness(1.05); }  /* Verde agua / Calma */
            60%  { filter: hue-rotate(220deg) saturate(1.2) brightness(1.05); }  /* Lavanda / Relajación mental */
            80%  { filter: hue-rotate(290deg) saturate(1.2) brightness(1.05); }  /* Violeta suave / Equilibrado */
            100% { filter: hue-rotate(360deg) saturate(1.2) brightness(1.05); }  /* Retorno suave a Cian */
        }

        @keyframes mascotHalfBalance {
            0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            25%  { transform: translate(-50%, -50%) rotate(-18deg) scale(1.02); } /* Solo hasta la mitad (18 grados) */
            75%  { transform: translate(-50%, -50%) rotate(18deg) scale(1.02); }  /* Solo hasta la mitad (18 grados) */
            100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        }

        /* MODO BATALLA: Aro con la secuencia rápida y enérgica (colores explosivos) */
        .neon-container.battle-mode {
            position: relative !important;
            top: auto !important; left: auto !important;
            margin: 15px auto !important;
            animation: ringEnergySync 3s infinite linear !important;
        }

        @keyframes ringEnergySync {
            0%   { border-color: #ff007f; box-shadow: 0 0 40px #ff007f, inset 0 0 15px #ff007f; }
            33%  { border-color: #ffaa00; box-shadow: 0 0 40px #ffaa00, inset 0 0 15px #ffaa00; }
            66%  { border-color: #00ff88; box-shadow: 0 0 40px #00ff88, inset 0 0 15px #00ff88; }
            100% { border-color: #ff007f; box-shadow: 0 0 40px #ff007f, inset 0 0 15px #ff007f; }
        }

        /* MODO BATALLA (MASCOTA): Colores súper vivos, brillantes y dinámicos para motivar la batalla y los regalos */
        .neon-container.battle-mode #avatar-layer {
            animation: mascotEnergyCycle 2.5s infinite linear, mascotBattleAction 1.2s infinite ease-in-out !important;
        }

        @keyframes mascotEnergyCycle {
            0%   { filter: hue-rotate(0deg) saturate(2.2) brightness(1.3); }
            33%  { filter: hue-rotate(110deg) saturate(2.5) brightness(1.4); }
            66%  { filter: hue-rotate(250deg) saturate(2.5) brightness(1.4); }
            100% { filter: hue-rotate(360deg) saturate(2.2) brightness(1.3); }
        }

        @keyframes mascotBattleAction {
            0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            25%  { transform: translate(-50%, -50%) rotate(-45deg) scale(1.12); } /* Giro más amplio y rápido estilo batalla */
            75%  { transform: translate(-50%, -50%) rotate(45deg) scale(1.12); }
            100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
        }
        
        /* LOGOTIPO FIJO: Posición y zoom inamovibles (top: 60%, left: 47%, tamaño 132px) */
        #logo-layer { 
            position: absolute; 
            top: 60%; 
            left: 47%; 
            width: 132px; 
            height: 132px;
            opacity: 1; 
            z-index: 2; 
            object-fit: cover; 
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease;
        } 
        
        /* MASCOTA: Zoom exacto (136px) */
        #avatar-layer { 
            position: absolute; 
            top: 52%; 
            left: 48.5%; 
            width: 136px; 
            height: 136px;
            opacity: 0; 
            z-index: 1; 
            object-fit: cover; 
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease;
        } 

        /* Transición de la mascota al activarse */
        .neon-container.show-mascot #logo-layer { opacity: 0; }
        .neon-container.show-mascot #avatar-layer { opacity: 1; }

        header {
            width: 100%; text-align: center; background: #070a12; position: sticky; top: 0; z-index: 10;
        }
        
        .mascot-status-tag {

            letter-spacing: 2px; padding: 4px 0; font-weight: bold; font-style: italic; background: #070a12;
        }
        
        .container { width: 92%; max-width: 420px; margin: 12px auto; display: flex; flex-direction: column; gap: 10px; }
        
        .card {
            background-color: var(--card-bg); border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .card-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-style: italic; }
        .status-badge { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 0.7rem; color: #a19bc8; margin-bottom: 3px; font-style: italic; }
        .neon-input {
            width: 100%; background: rgba(0, 242, 254, 0.05); border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 6px; padding: 8px; color: #fff; font-size: 0.85rem; box-sizing: border-box;
            outline: none; font-family: inherit; font-style: italic;
        }

        .dropdown-trigger-btn {
            background: linear-gradient(135deg, #ff007f, #4facfe);
            color: #fff; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.75rem; font-weight: bold; text-align: center; cursor: pointer;
            width: 100%; text-transform: uppercase; font-style: italic; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); margin-top: 6px;
        }

        .voice-dropdown-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000; border: none; border-radius: 8px; padding: 12px;
            font-size: 0.75rem; font-weight: bold; text-align: center; cursor: pointer;
            width: 100%; text-transform: uppercase; font-style: italic; box-sizing: border-box;
            margin-top: 6px; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .collapsible-content.show { max-height: 1800px; transition: max-height 0.5s ease-in; }

        .effects-grid-6 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
        }
        .effect-box {
            background: rgba(255, 0, 127, 0.05); border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 8px; padding: 8px; text-align: center;
        }
        .effect-box-title {
            font-size: 0.65rem; color: #ff007f; font-weight: bold; font-style: italic; margin-bottom: 6px; min-height: 22px;
        }
        .play-effect-btn {
            width: 100%; background: rgba(255, 0, 127, 0.2); border: 1px solid rgba(255, 0, 127, 0.4);
            color: #ff007f; padding: 6px; border-radius: 4px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; text-transform: uppercase; font-style: italic; margin-bottom: 4px;
        }
